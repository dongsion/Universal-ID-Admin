<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal ID - 商家后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="merchant-app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">📊</span>
      <span class="logo-text">Universal<span class="logo-accent">ID</span></span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="dashboard">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        <span>仪表盘</span>
      </button>
      <button class="nav-item" data-tab="products">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6l7-3 7 3v8l-7 3-7-3V6z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3 6l7 3 7-3M10 9v8" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>商品管理</span>
      </button>
      <button class="nav-item" data-tab="orders">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 5h12l-1 8H5L4 5z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="7" cy="17" r="1.5" fill="currentColor"/><circle cx="13" cy="17" r="1.5" fill="currentColor"/><path d="M4 5l-1-2H1" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>订单管理</span>
        <span class="nav-badge" id="nav-order-badge" style="display:none">0</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <a href="https://dongsion.github.io/Universal-ID/" class="view-store" target="_blank">查看店铺 →</a>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- ====== 仪表盘 ====== -->
    <section class="tab-content active" id="tab-dashboard">
      <div class="page-header">
        <h1>仪表盘</h1>
        <p class="page-sub">店铺运营数据概览</p>
      </div>
      <div class="stats-grid" id="stats-grid">
        <!-- JS 注入统计卡片 -->
      </div>
      <div class="dashboard-row">
        <div class="dash-panel">
          <div class="panel-header">
            <h2>库存预警</h2>
            <span class="panel-sub">需要补货的商品</span>
          </div>
          <div class="panel-body" id="low-stock-list">
            <!-- JS 注入 -->
          </div>
        </div>
        <div class="dash-panel">
          <div class="panel-header">
            <h2>最近订单</h2>
            <span class="panel-sub">最新 5 笔订单</span>
          </div>
          <div class="panel-body" id="recent-orders-list">
            <!-- JS 注入 -->
          </div>
        </div>
      </div>
    </section>

    <!-- ====== 商品管理 ====== -->
    <section class="tab-content" id="tab-products">
      <div class="page-header">
        <div>
          <h1>商品管理</h1>
          <p class="page-sub">管理你的商品目录</p>
        </div>
        <button class="btn-primary" onclick="showProductForm()">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          添加商品
        </button>
      </div>
      <div class="product-table-wrap">
        <table class="product-table" id="product-table">
          <thead>
            <tr>
              <th>商品</th>
              <th>分类</th>
              <th>价格</th>
              <th>库存</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="product-tbody">
            <!-- JS 注入 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ====== 订单管理 ====== -->
    <section class="tab-content" id="tab-orders">
      <div class="page-header">
        <h1>订单管理</h1>
        <p class="page-sub">查看和处理顾客订单</p>
      </div>
      <div class="order-filters">
        <button class="filter-tab active" data-filter="all">全部</button>
        <button class="filter-tab" data-filter="pending">待处理</button>
        <button class="filter-tab" data-filter="completed">已完成</button>
        <button class="filter-tab" data-filter="cancelled">已取消</button>
      </div>
      <div class="order-list" id="order-list">
        <!-- JS 注入 -->
      </div>
    </section>
  </main>

  <!-- ====== 商品添加/编辑弹窗 ====== -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">添加商品</h2>
        <button class="modal-close" onclick="closeProductForm()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>商品图片</label>
          <div class="img-upload" id="img-upload" onclick="document.getElementById('m-image').click()">
            <div class="img-placeholder" id="m-img-placeholder">
              <svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 6v16M6 14h16" stroke="#bbb" stroke-width="2" stroke-linecap="round"/></svg>
              <span>上传图片</span>
            </div>
            <img class="img-preview" id="m-img-preview" style="display:none">
          </div>
          <input type="file" id="m-image" accept="image/*" style="display:none">
        </div>
        <div class="form-group">
          <label>商品名称</label>
          <input type="text" id="m-name" placeholder="例如：椰子脆片" maxlength="30">
        </div>
        <div class="form-group">
          <label>品牌</label>
          <input type="text" id="m-brand" placeholder="例如：Dang" maxlength="20">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>价格 ($)</label>
            <input type="number" id="m-price" placeholder="6.00" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label>库存</label>
            <input type="number" id="m-stock" placeholder="100" min="0" step="1">
          </div>
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="m-category">
            <option value="Chips">薯片</option>
            <option value="Choco">巧克力</option>
            <option value="Drinks">饮料</option>
            <option value="Cookies">饼干</option>
            <option value="Nuts">坚果</option>
          </select>
        </div>
        <div class="form-group">
          <label>卡片背景色</label>
          <div class="color-picker" id="m-color-picker">
            <div class="color-opt selected" data-color="#FFF3D6" style="background:#FFF3D6"></div>
            <div class="color-opt" data-color="#D6F5E0" style="background:#D6F5E0"></div>
            <div class="color-opt" data-color="#F5D6E0" style="background:#F5D6E0"></div>
            <div class="color-opt" data-color="#D6E8F5" style="background:#D6E8F5"></div>
            <div class="color-opt" data-color="#E0D6F5" style="background:#E0D6F5"></div>
            <div class="color-opt" data-color="#F5E8D6" style="background:#F5E8D6"></div>
            <div class="color-opt" data-color="#D6F5E8" style="background:#D6F5E8"></div>
            <div class="color-opt" data-color="#F5D6D6" style="background:#F5D6D6"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeProductForm()">取消</button>
        <button class="btn-primary" id="m-save-btn" onclick="saveProductForm()">保存商品</button>
      </div>
    </div>
  </div>

  <!-- ====== 订单详情弹窗 ====== -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal modal-narrow">
      <div class="modal-header">
        <h2>订单详情</h2>
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
      </div>
      <div class="modal-body" id="order-modal-body">
        <!-- JS 注入 -->
      </div>
      <div class="modal-footer" id="order-modal-footer">
        <!-- JS 注入 -->
      </div>
    </div>
  </div>

  <!-- ====== Toast ====== -->
  <div class="toast" id="m-toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
